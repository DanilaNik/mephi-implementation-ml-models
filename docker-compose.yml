services:

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: danilanik22/credit-default-svc:latest
    container_name: credit-default-api
    ports:
      - "5000:5000"
    environment:
      LOG_LEVEL: INFO
      PORT: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "owner=mephi-m255616"
      - "stage=session-project"

  # Демо-агрегатор логов: nginx раздаёт каталог с логами по http,
  # имитируя точку сбора
  log-viewer:
    image: nginx:1.27-alpine
    container_name: credit-default-logs
    ports:
      - "8080:80"
    volumes:
      - api_logs:/usr/share/nginx/html:ro
    depends_on:
      - api

  # Опциональный брокер очередей: запускается отдельным профилем, чтобы не утяжелять обычный docker compose up.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: credit-default-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    profiles: ["broker"]

volumes:
  api_logs:
